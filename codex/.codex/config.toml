sandbox_mode = "danger-full-access"
approval_policy = "never"
model = "gpt-5.6-sol"
model_reasoning_effort = "low"
service_tier = "ultrafast"
allow_login_shell = true
include_environment_context = true
suppress_unstable_features_warning = true

[agents]
max_threads = 4
max_depth = 2

[desktop]
followUpQueueMode = "queue"
appearanceTheme = "system"
appearanceLightCodeThemeId = "github"
appearanceDarkCodeThemeId = "github"
sansFontSize = 14
codeFontSize = 12
usePointerCursors = true
mac-menu-bar-enabled = false
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
open-link-in-target-preference = "in-app-browser"
ambient-suggestions-enabled = false
avatar-overlay-mascot-width-px = 80
conversationDetailMode = "STEPS_COMMANDS"
defaultTerminalLocation = "right"
appearanceDiffMarkerStyle = "symbols"
composerPlainTextMode = true

[desktop.appearanceLightChromeTheme]
accent = "#0969da"
contrast = 45
ink = "#1e1e1e"
opaqueWindows = true
surface = "#eff1f5"

[desktop.appearanceLightChromeTheme.fonts]
code = "JetBrains Mono"
ui = "Satoshi"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#1a7f37"
diffRemoved = "#cf222e"
skill = "#8250df"

[desktop.appearanceDarkChromeTheme]
accent = "#1f6feb"
contrast = 45
ink = "#e6edf3"
opaqueWindows = true
surface = "#1e1e1e"

[desktop.appearanceDarkChromeTheme.fonts]
code = "JetBrains Mono"
ui = "Satoshi"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#3fb950"
diffRemoved = "#f85149"
skill = "#bc8cff"

[features]
js_repl = false
default_mode_request_user_input = false
terminal_visualization_instructions = true

[plugins."sites@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[apps.connector_20205bf7d4e99a89d7154bb849718324]
enabled = false

[apps.connector_openai_codex_document_control]
enabled = false

[apps.asdk_app_69a089a326dc8191b32a3f2553f5be2c]
enabled = false

[features.multi_agent_v2]
enabled = false
