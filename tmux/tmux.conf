# Reload
unbind r
bind r source-file $HOME/.tmux.conf

# Rebind leader
# set -g prefix C-Space
set -g prefix `

# Enable mouse support
set -g mouse on
set -g set-clipboard on
set -g assume-paste-time 200

# Enable copy on selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/.local/bin/copy-to-clipboard"

# Enable extended keys
set -g extended-keys on

# Cursor/VS Code emits dense wheel events. Reduce tmux copy-mode step size.
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Vi keys in copy mode.
set-window-option -g mode-keys vi
unbind -T copy-mode WheelUpPane
unbind -T copy-mode WheelDownPane

# Use tmux terminfo inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm*:RGB"

# Move status to the bottom
set-option -g status-position bottom

# Dont show pane border status
set-window-option -g pane-border-status off

# Start windows and panes from 1
set -g base-index 1
set -g pane-base-index 1

# Pane selection
bind-key j select-pane -L
bind-key k select-pane -D
bind-key l select-pane -U
bind-key ';' select-pane -R

# Pane creation
unbind '"'
unbind %
bind - split-window -v
bind '=' split-window -h

# Ring terminal bell for non-zero exits (ignore exit 0)
set-hook -g pane-died "if -F '#{&&:#{!=:#{pane_dead_status},0},#{!=:#{pane_dead_status},130}}' \"run-shell 'printf \\a'\""

# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'

# Run tpm (plugin manager)
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# Theme
# ============================================================================

# Use the terminal background and gray text for the status bar.
# Align window tabs to the left. Hide the session label and right section.
# Put one space between tabs.
set -g status-style 'bg=default,fg=#8d8f97'
set -g status-justify left
set -g status-left ''
set -g status-right ''
set -g window-status-separator ' '

# Use gray text for inactive tabs and a gray background for the active tab.
set -g window-status-style 'bg=default,fg=#8d8f97'
set -g window-status-current-style 'bg=#8d8f97,fg=#1E1E1E,bold'

# Tab labels: #I = window number, #W = window name, #F = window flags.
# Flags include * for the active window and - for the previous window.
set -g window-status-format ' #I #W #F '
set -g window-status-current-format ' #I #W #F '

# Set tab colors for activity and bell alerts.
set -g window-status-activity-style 'bg=#38383b,fg=#8d8f97'
set -g window-status-bell-style 'bg=#8d8f97,fg=#151515,bold'

# Use a lighter border to identify the active pane.
set -g pane-border-style 'fg=#2C2C2E'
set -g pane-active-border-style 'fg=#8d8f97'

# Set colors for status messages and the tmux command prompt.
set -g message-style 'bg=#2C2C2E,fg=#8d8f97'
set -g message-command-style 'bg=#8d8f97,fg=#1E1E1E'

# Highlight selected text in copy mode and selected items in choice lists.
set -g mode-style 'bg=#8d8f97,fg=#1E1E1E'

# Set colors for the pane numbers shown by display-panes.
# Use a lighter number for the active pane.
set -g display-panes-colour '#38383b'
set -g display-panes-active-colour '#8d8f97'

# Set the clock color in clock mode.
set -g clock-mode-colour '#8d8f97'
